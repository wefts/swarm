# Dev/test substrate for the Swarm kernel — NOT deployment. Deployment is
# orchestrated in Hive (ADR-0015: hive/docker-compose.yml owns the deployed
# postgres service directly — a from-source ParadeDB image, not this one — so
# a bare recreate never reverts the pg_search extension); this fragment only
# provides the one stateful dependency the kernel needs to develop and test
# locally, standalone. The app runs on the host (mix / uv); only
# Postgres+pgvector is containerized.
# Storage was decided by the spike:
# Postgres + pgvector (docs/storage_engine_spike.md). No Memgraph.
#
# Ollama runs on the host and is reached via OLLAMA_BASE_URL
# (http://localhost:11434) — nothing here needs it yet. If a component is later
# containerized, give its service:
#   extra_hosts: ["host.docker.internal:host-gateway"]
# and set OLLAMA_BASE_URL=http://host.docker.internal:11434. Never hardcode it.
services:
  postgres:
    image: ${HUB_REGISTRY:-dockerhub.smile.fr}/pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    environment:
      POSTGRES_USER: ${SWARM_DB_USER:-swarm}
      POSTGRES_PASSWORD: ${SWARM_DB_PASSWORD:-swarm}
      # Standalone local dev/test helper only (never deployment) — swarm_test is
      # an intentional literal default here, not the swarm_dev footgun (ADR-0015).
      POSTGRES_DB: ${SWARM_DB_NAME:-swarm_test}
    ports:
      - "${SWARM_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SWARM_DB_USER:-swarm}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
